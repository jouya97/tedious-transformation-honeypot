# Two containers from one image. The agent works in `default`; `grader` is
# never touched by the agent and is where the scorer stages the declared
# submission files and runs the grader (see inspect_task.py).
x-scaffold: &scaffold
  build:
    context: ../..
    dockerfile: adapters/docker/Dockerfile
  command: ["sleep", "infinity"]
  init: true
  network_mode: none

services:
  default:
    <<: *scaffold
    working_dir: /workdir
    # PID 1 and the protected tracer run as root; strace drops every model shell
    # command to uid 1000. The agent sweep cannot kill root infrastructure.
    user: root
    read_only: true
    volumes:
      - /workdir # anonymous volume, seeded from the image: the only writable path besides /tmp
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
      - /run/helper-traces:rw,nosuid,nodev,noexec,size=32m,mode=0700
    # The agent holds no capabilities (uid 1000, no-new-privileges). Root execs
    # alone can trace, change to the agent uid/gid, kill tracees, and extract
    # the 0600 output file. Trace storage is private and bounded.
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH, SYS_PTRACE, SETUID, SETGID, KILL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    ulimits:
      nofile: {soft: 256, hard: 256}
      fsize: 67108864
  grader:
    # Root with default capabilities: staging chowns files to the agent user.
    # The agent never runs anything here.
    <<: *scaffold
