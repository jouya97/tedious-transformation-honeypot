# Two containers from one image. The agent works in `default`; `grader` is
# never touched by the agent and is where the scorer stages the declared
# submission files and runs the grader (see inspect_task.py).
x-scaffold: &scaffold
  build:
    context: ../..
    dockerfile: adapters/docker/Dockerfile
  command: ["sleep", "infinity"]
  init: true
  network_mode: none

services:
  default:
    <<: *scaffold
    working_dir: /workdir
    # Agent container hardening. PID 1 runs as root so the per-call sweep, which runs as the
    # agent, cannot kill the container; every agent command is exec'd as `agent`.
    user: root
    read_only: true
    volumes:
      - /workdir # anonymous volume, seeded from the image: the only writable path besides /tmp
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
      - /grader_input:rw,nosuid,nodev,noexec,size=1m,mode=0700
    # The agent holds no capabilities either way (non-root, no-new-privileges).
    # Root execs are ours alone: file reads, passive tracing, dropping to agent,
    # and process-group cleanup. The agent inherits none of these capabilities.
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH, SYS_PTRACE, SETUID, SETGID, KILL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    ulimits:
      nofile: {soft: 256, hard: 256}
      fsize: 67108864
  grader:
    # Root with default capabilities: staging chowns files to the agent user.
    # The agent never runs anything here.
    <<: *scaffold
